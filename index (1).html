class="card"><h2>Add dog</h2><form id="dogForm"><label class="field">Dog name<input name="name" required maxlength="70"></label><label class="field">Breed<input name="breed" required maxlength="70"></label><label class="field">Owner<select name="ownerId" required>${state.owners.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></label><label class="field">Vaccination expiry<input type="date" name="vacc" required></label><button class="btn">Save dog</button></form></div></div><div class="card"><h2>Registered dogs</h2><div class="tablewrap"><table class="table"><thead><tr><th>Dog</th><th>Owner</th><th>Vaccination expiry</th><th>Status</th><th>Update</th></tr></thead><tbody>${state.dogs.map(d=>`<tr><td><b>${esc(d.name)}</b><div class="muted smalltext">${esc(d.breed)}</div></td><td>${esc(owner(d.ownerId)?.name)}</td><td>${esc(d.vacc)}</td><td>${tag(vaccStatus(d))}</td><td><button class="btn ghost small" data-edit-vacc="${d.id}">Edit expiry</button></td></tr>`).join('')}</tbody></table></div></div>`}function dataTab(){return `<div class="card"><h2>Demo data tools</h2><p class="muted">Download a backup, restore a saved backup or reset to sample data. Backups contain personal information if you enter any.</p><div class="actions"><button class="btn" id="export">Download JSON backup</button><label class="btn secondary" style="cursor:pointer">Import JSON backup<input id="import" type="file" accept=".json,application/json" class="hidden"></label><button class="btn ghost" id="reset">Reset sample data</button></div><div class="notice ${persistent?'':'danger'}">${persistent?'Browser storage currently available.':'Storage is unavailable. Use Export to keep your changes.'} In private/incognito browsing, saved data is generally removed when the private session ends. Use a backup if you need to keep it.</div></div>`}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render()});['prevWeek','nextWeek'].forEach(id=>{const b=$('#'+id);if(b)b.onclick=()=>{weekOffset+=id==='nextWeek'?1:-1;render()}});const bf=$('#bookForm');if(bf){const refreshSlots=()=>{const date=bf.elements.date.value||today(),slots=availableSlots(date),timeEl=bf.elements.time,staffEl=bf.elements.staff,oldTime=timeEl.value,oldStaff=staffEl.value,times=[...new Set(slots.map(x=>x.time))];timeEl.innerHTML=times.length?times.map(t=>`<option value="${t}">${t}–${String(Number(t.slice(0,2))+1).padStart(2,'0')}:00 (${slots.filter(x=>x.time===t).length} left)</option>`).join(''):'<option value="">No available times</option>';if(times.includes(oldTime))timeEl.value=oldTime;const updateStaff=()=>{const matching=slots.filter(x=>x.time===timeEl.value);staffEl.innerHTML=matching.length?matching.map(x=>`<option value="${x.staff}">${x.staff}</option>`).join(''):'<option value="">No staff available</option>';if(matching.some(x=>x.staff===oldStaff))staffEl.value=oldStaff};timeEl.onchange=updateStaff;updateStaff()};bf.elements.date.onchange=refreshSlots;refreshSlots();bf.onsubmit=e=>{e.preventDefault();const val=n=>bf.querySelector('[name="'+n+'"]').value.trim();const day=val('date'),out=$('#bookResult'),name=val('ownerName'),email=val('email').toLowerCase(),dogName=val('dogName'),breed=val('breed'),vacc=val('vacc'),vaccDate=val('vaccDate'),time=val('time'),staff=val('staff');const error=message=>{out.innerHTML='<div class="notice danger">'+esc(message)+'</div>';out.scrollIntoView({block:'nearest'});};try{if(!name||!email||!dogName||!breed||!day||!time||!staff)return error('Please complete every required field, including the time and staff member.');if(day<today())return error('Choose today or a future date.');if(!vacc)return error('Please enter a vaccination expiry date to confirm your booking.');if(vacc<day)return error('Vaccination must be valid on the appointment date.');if(vaccDate&&vaccDate>vacc)return error('Vaccination date cannot be later than its expiry.');if(!slotAvailable(day,time,staff))return error('That appointment has just been taken. Please choose another time or staff member.');if(count(day)>=CAP)return error('This day is fully booked. Please select another date.');let o=state.owners.find(x=>x.email.toLowerCase()===email);let d=o&&state.dogs.find(x=>x.ownerId===o.id&&x.name.toLowerCase()===dogName.toLowerCase());if(d&&isBooked(d.id,day,time))return error('This dog is already booked for that hour.');if(!o){o={id:uid(),name,email,code:uid().toUpperCase()};state.owners.push(o)}if(!d){d={id:uid(),name:dogName,breed,ownerId:o.id,vacc,vaccDate};state.dogs.push(d)}else{d.breed=breed;d.vacc=vacc;if(vaccDate)d.vaccDate=vaccDate}const booking={id:uid(),dogId:d.id,date:day,time,staff,checked:false};state.bookings.push(booking);save();selectedDate=day;lastConfirmation='<div class="notice success" role="alert"><h3>✓ Booking confirmed!</h3><p><strong>'+esc(d.name)+'</strong> — '+dateLabel(day)+' · '+esc(time)+'–'+String(Number(time.slice(0,2))+1).padStart(2,'0')+':00 · '+esc(staff)+'</p><p>Booking reference: <strong>'+esc(booking.id)+'</strong></p><p>Saved in the admin Bookings records. This staff/time appointment is no longer available.</p></div>';render();const result=$('#bookResult');if(result)result.scrollIntoView({behavior:'smooth',block:'center'});notify('Booking confirmed and saved');}catch(err){console.error('Booking error',err);error('We could not complete your booking. Please try again.')}};}const pf=$('#pupdateForm');if(pf)pf.onsubmit=e=>{e.preventDefault();const o=state.owners.find(o=>o.email.toLowerCase()===pf.elements.email.value.trim().toLowerCase()),d=o&&state.dogs.find(d=>d.ownerId===o.id&&d.name.toLowerCase()===pf.elements.dogName.value.trim().toLowerCase()),out=$('#pupdateResult');if(!d){out.innerHTML='<div class="notice danger">No matching dog found for those details.</div>';return}const notes=state.notes.filter(n=>n.dogId===d.id&&n.date===today()),booked=isBooked(d.id,today());out.innerHTML=`<h2>🐶 ${esc(d.name)}</h2><p class="muted">Updates for ${dateLabel(today())}</p>${!booked?'<p class="muted">Not booked for today.</p>':notes.length?notes.map(n=>`<p>✓ ${esc(n.type)} <span class="muted">at ${esc(n.time)}</span></p>`).join(''):'<p class="muted">No activity notes posted yet.</p>'}`};const lf=$('#loginForm');if(lf)lf.onsubmit=e=>{e.preventDefault();if(lf.elements.username.value==='admin'&&lf.elements.password.value==='Waggy2026!'){admin=true;render()}else notify('Incorrect demo credentials')};const lo=$('#logout');if(lo)lo.onclick=()=>{admin=false;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab;render()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const bk=state.bookings.find(x=>x.id===b.dataset.check),d=dog(bk.dogId);if(vaccStatus(d)==='Expired')return notify('Check-in blocked: expired vaccination');bk.checked=!bk.checked;save();render()});document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{const d=b.dataset.note,type=b.dataset.type;if(!state.bookings.some(x=>x.dogId===d&&x.date===today()&&x.checked))return;const existing=state.notes.find(n=>n.dogId===d&&n.date===today()&&n.type===type);if(existing)return notify('Already recorded today');state.notes.push({id:uid(),dogId:d,date:today(),type,time:new Date().toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit',hour12:false})});save();render();notify(`${type} saved`)});document.querySelectorAll('[data-remove-booking]').forEach(b=>b.onclick=()=>{if(!confirm('Cancel this booking?'))return;state.bookings=state.bookings.filter(x=>x.id!==b.dataset.removeBooking);save();render()});document.querySelectorAll('[data-edit-vacc]').forEach(b=>b.onclick=()=>{const d=dog(b.dataset.editVacc),v=prompt(`Vaccination expiry for ${d.name} (YYYY-MM-DD):`,d.vacc);if(v===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||Number.isNaN(new Date(v+'T12:00:00').getTime()))return notify('Enter a valid YYYY-MM-DD date');d.vacc=v;save();render()});const of=$('#ownerForm');if(of)of.onsubmit=e=>{e.preventDefault();const f=of.elements,code=f.code.value.trim();if(state.owners.some(o=>o.code.toLowerCase()===code.toLowerCase()))return notify('Code already used');state.owners.push({id:uid(),name:f.name.value.trim(),email:f.email.value.trim(),code});save();render();notify('Owner added')};const df=$('#dogForm');if(df)df.onsubmit=e=>{e.preventDefault();const f=df.elements;state.dogs.push({id:uid(),name:f.name.value.trim(),breed:f.breed.value.trim(),ownerId:f.ownerId.value,vacc:f.vacc.value});save();render();notify('Dog added')};const ex=$('#export');if(ex)ex.onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='waggy-tails-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};const im=$('#import');if(im)im.onchange=async()=>{const file=im.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.owners)||!Array.isArray(data.dogs)||!Array.isArray(data.bookings)||!Array.isArray(data.notes))throw Error();if(!confirm('Replace all current data with this backup?'))return;state=data;save();render();notify('Backup restored')}catch(e){notify('Invalid backup file')}};const rs=$('#reset');if(rs)rs.onclick=()=>{if(!confirm('Reset all records to sample data? This cannot be undone without a backup.'))return;state=defaults();save();render();notify('Sample data restored')}}function go(p){if(p!=='book')lastConfirmation=null;page=p;window.scrollTo({top:0,behavior:'smooth'});render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));selectedDate=today();save();render()})();
</script></body></html>
